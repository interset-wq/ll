{% extends 'base.html' %}

{% block title %}Login - Learning Log{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Login</h1>

<div class="bg-white p-6 rounded-lg shadow max-w-md">
    {% if form.errors %}
    <div class="bg-red-100 text-red-800 p-3 rounded-lg mb-4">
        Your username and password didn't match. Please try again.
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" id="id_username" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <div class="mb-4">
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="id_password" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <input type="hidden" name="next" value="{% url 'learning_logs:index' %}">
        <button type="submit" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">Login</button>
    </form>
    <p class="text-sm text-gray-500 mt-4 text-center">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-indigo-600 hover:text-indigo-800">Register</a></p>
</div>
{% endblock %}
