{% extends 'base.html' %}

{% block title %}Register - Learning Log{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Register</h1>

<div class="bg-white p-6 rounded-lg shadow max-w-md">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-4">
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" {% if field.value %}value="{{ field.value }}"{% endif %} required>
            {% if field.errors %}
            <p class="text-red-600 text-sm mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">Register</button>
    </form>
    <p class="text-sm text-gray-500 mt-4 text-center">Already have an account? <a href="{% url 'accounts:login' %}" class="text-indigo-600 hover:text-indigo-800">Login</a></p>
</div>
{% endblock %}
