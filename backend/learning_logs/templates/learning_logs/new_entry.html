{% extends 'base.html' %}

{% block title %}New Entry - {{ topic }} - Learning Log{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-2">New Entry</h1>
<p class="text-gray-500 mb-6">Topic: {{ topic }}</p>

<div class="bg-white p-6 rounded-lg shadow max-w-2xl">
    <form method="post">
        {% csrf_token %}
        {{ form.media }}
        <div class="mb-4">
            <label for="id_title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            {{ form.title }}
        </div>
        <div class="mb-4">
            <label for="id_text" class="block text-sm font-medium text-gray-700 mb-1">Entry</label>
            {{ form.text }}
        </div>
        <div class="flex space-x-4">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">Add Entry</button>
            <a href="{% url 'learning_logs:topic' topic.pk %}" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
