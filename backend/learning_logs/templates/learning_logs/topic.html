{% extends 'learning_logs/base.html' %}

{% block content %}
  <h1>Topic: {{ topic }}</h1>
  <p>Entries: </p>
  <a><a href="{% url 'learning_logs:new_entry' topic.pk %}">New Entry</a></p>
  <ul>
    {% for entry in entries %}
      <li>
        <p>{{ entry.date_added|date:'M d, Y H:i' }}
        <a href="{% url 'learning_logs:edit_entry' entry.pk %}">Edit</a>
        </p>
        <p>{{ entry.text|linebreaks }}</p>
      </li>
    {% empty %}
      <li>No entries.</li>
    {% endfor %}
  </ul>
{% endblock %}
